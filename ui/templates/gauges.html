<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');
  :root{--cyan:#00E5FF;--amber:#FFB300;--red:#FF5252;--text:#E6F1FF;--muted:#8FA6C2;
    --mono:'Share Tech Mono','Consolas',monospace;--head:'Orbitron','Rajdhani',sans-serif;--data:'Rajdhani',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--text);font-family:var(--data)}
  .gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .gauge{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 5px 7px;
    background:rgba(7,16,31,.88);border:1px solid rgba(0,229,255,.16);
    clip-path:polygon(0 9px,9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
    transition:border-color .18s ease,box-shadow .18s ease}
  .gauge:hover{border-color:rgba(0,229,255,.42);box-shadow:0 0 24px rgba(0,229,255,.08)}
  svg{width:104px;height:104px;overflow:visible}
  .track{stroke:rgba(143,166,194,.18)}
  .fill{stroke:var(--cyan);filter:drop-shadow(0 0 5px rgba(0,229,255,.7));stroke-linecap:round}
  .gauge.amber .fill{stroke:var(--amber);filter:drop-shadow(0 0 5px rgba(255,179,0,.65))}
  .gauge.red .fill{stroke:var(--red);filter:drop-shadow(0 0 5px rgba(255,82,82,.6))}
  .value{position:absolute;top:42px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:17px;color:var(--text);white-space:nowrap}
  .unit{font-size:10px;color:var(--muted);margin-left:2px}
  .label{margin-top:2px;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-align:center}
  .sub{margin-top:3px;font-family:var(--mono);font-size:8px;color:rgba(143,166,194,.75);text-align:center;max-width:140px;line-height:1.35}
  .note{margin-top:7px;font-family:var(--mono);font-size:8px;line-height:1.5;color:var(--muted);border-left:2px solid rgba(0,229,255,.3);padding-left:7px}
  .reduced *{animation:none!important;transition:none!important}
  @media(max-width:760px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}svg{width:92px;height:92px}.value{top:36px;font-size:15px}}
  @media(max-width:430px){.gauges{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="gauges" id="gauges"></div>
<div class="note">Uncalibrated heuristics: these rings visualise comparison measurements and alignment evidence. They are not defect probabilities or calibrated confidence scores.</div>
<script>
const DATA = __DATA__;
const REDUCED = __REDUCED__ || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (REDUCED) document.body.classList.add('reduced');
const root = document.getElementById('gauges');
const radius = 44;
const circumference = 2 * Math.PI * radius;

DATA.forEach((gauge, index) => {
  const card = document.createElement('div');
  card.className = 'gauge ' + (gauge.tone || '');
  card.title = gauge.aria + ' Uncalibrated heuristic.';
  const fraction = Math.min(1, Math.max(0, Number(gauge.fraction) || 0));
  const numeric = gauge.numeric === undefined
    ? !Number.isNaN(Number(gauge.value))
    : Boolean(gauge.numeric);
  const display = String(gauge.display);
  const unit = numeric && gauge.unit ? `<span class="unit">${gauge.unit}</span>` : '';
  card.innerHTML = `
    <svg viewBox="0 0 108 108" role="img" aria-label="${gauge.aria}">
      <circle class="track" cx="54" cy="54" r="${radius}" fill="none" stroke-width="7"></circle>
      <circle class="fill" cx="54" cy="54" r="${radius}" fill="none" stroke-width="7"
        stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"
        transform="rotate(-90 54 54)"></circle>
    </svg>
    <div class="value"><span class="number">${numeric ? '0' : display}</span>${numeric ? unit : ''}</div>
    <div class="label">${gauge.label}</div>
    <div class="sub">${gauge.sub || ''}</div>`;
  root.appendChild(card);
  const ring = card.querySelector('.fill');
  const number = card.querySelector('.number');
  const targetOffset = circumference * (1 - fraction);
  if (REDUCED || !numeric){
    ring.style.strokeDashoffset = String(targetOffset);
    if (numeric) number.textContent = display;
    return;
  }
  const started = performance.now();
  const duration = 800 + index * 90;
  const frame = (now) => {
    const progress = Math.min(1, (now - started) / duration);
    const eased = 1 - Math.pow(1 - progress, 3);
    ring.style.strokeDashoffset = String(circumference * (1 - fraction * eased));
    const value = Number(gauge.value) * eased;
    number.textContent = (Number(gauge.value) >= 100 || gauge.value === 0)
      ? value.toFixed(0)
      : value.toFixed(Number(gauge.value) < 10 ? 2 : 1);
    if (progress < 1) requestAnimationFrame(frame);
    else number.textContent = display;
  };
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
