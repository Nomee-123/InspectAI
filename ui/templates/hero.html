<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');
  :root{
    --navy:#050B18;--cyan:#00E5FF;--blue:#2979FF;--amber:#FFB300;--text:#E6F1FF;
    --muted:#8FA6C2;--mono:'Share Tech Mono','Consolas',monospace;
    --head:'Orbitron','Rajdhani','Segoe UI',sans-serif;
    --data:'Rajdhani','Share Tech Mono',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:var(--data);overflow:hidden}
  #hero{
    position:relative;overflow:hidden;isolation:isolate;
    display:flex;align-items:center;gap:18px;min-height:178px;
    padding:22px 24px;
    background:
      linear-gradient(100deg,rgba(8,18,34,.97),rgba(5,11,24,.9) 56%,rgba(0,229,255,.06)),
      radial-gradient(circle at 78% 30%,rgba(41,121,255,.2),transparent 46%);
    border:1px solid rgba(0,229,255,.22);
    clip-path:polygon(0 18px,18px 0,calc(100% - 46px) 0,100% 46px,100% 100%,0 100%);
  }
  #hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(to bottom,rgba(230,241,255,.03) 0 1px,transparent 1px 4px);
    opacity:.6;
  }
  #hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:linear-gradient(90deg,transparent,rgba(0,229,255,.09),transparent);
    transform:translateX(-100%);animation:sweep 8s ease-in-out infinite;
  }
  #field{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
  .veil{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(circle at 20% 50%,transparent 0 30%,rgba(5,11,24,.55) 78%)}
  .reticle{position:relative;z-index:2;flex:0 0 104px;width:104px;height:104px;
    filter:drop-shadow(0 0 16px rgba(0,229,255,.35))}
  .orbit{transform-origin:60px 60px;animation:spin 18s linear infinite}
  .orbit-fast{transform-origin:60px 60px;animation:spin 7.5s linear infinite reverse}
  .arc{transform-origin:60px 60px;animation:spin 3.8s linear infinite}
  .brand{position:relative;z-index:2;min-width:0;flex:1 1 auto}
  .kicker{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:9px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--cyan)}
  .kicker::before{content:"";width:24px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan));box-shadow:0 0 10px var(--cyan)}
  h1{margin:7px 0 0;font-family:var(--head);font-weight:900;line-height:.94;
    font-size:clamp(24px,4.6vw,46px);letter-spacing:.075em;color:#f5fbff;
    text-shadow:0 0 30px rgba(0,229,255,.32)}
  h1 .slash{color:var(--cyan)}
  .sub{margin-top:7px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--cyan)}
  .status{display:flex;flex-wrap:wrap;gap:5px 14px;margin-top:9px;font-family:var(--mono);
    font-size:8.5px;letter-spacing:.07em;color:var(--muted)}
  .status .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;
    background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 2.6s ease-in-out infinite}
  .status .dot.amber{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .badge{position:absolute;z-index:4;right:18px;top:18px;display:inline-flex;align-items:center;
    gap:7px;padding:6px 9px;border:1px solid rgba(0,229,255,.32);
    background:rgba(4,10,22,.78);font-family:var(--mono);font-size:8px;
    letter-spacing:.13em;text-transform:uppercase;color:var(--text);white-space:nowrap}
  .badge img{height:22px;width:auto;display:block}
  .badge .lt{color:var(--cyan);font-weight:700}
  .boot{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
    justify-content:center;padding:18px 26px;background:rgba(3,8,18,.975);
    transition:opacity .55s ease,visibility .55s ease}
  .boot.done{opacity:0;visibility:hidden}
  .boot-head{font-family:var(--head);font-size:11px;letter-spacing:.22em;color:var(--cyan);
    text-transform:uppercase;margin-bottom:9px}
  .boot-lines{font-family:var(--mono);font-size:9px;line-height:1.9;color:var(--muted);
    white-space:pre-wrap;min-height:68px}
  .boot-lines b{color:var(--text);font-weight:400}
  .boot-lines .ok{color:var(--cyan)}
  .boot-track{height:2px;margin-top:10px;background:rgba(143,166,194,.2);overflow:hidden}
  .boot-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));
    box-shadow:0 0 12px var(--cyan);animation:load 2.55s cubic-bezier(.2,.7,.2,1) forwards}
  .boot-foot{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);
    font-size:7.5px;letter-spacing:.12em;color:rgba(143,166,194,.75);text-transform:uppercase}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes sweep{0%,10%{transform:translateX(-100%);opacity:0}26%{opacity:.85}58%,100%{transform:translateX(100%);opacity:0}}
  @keyframes load{to{width:100%}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:640px){
    #hero{min-height:150px;padding:16px 16px;gap:12px;clip-path:polygon(0 12px,12px 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%)}
    .reticle{flex-basis:70px;width:70px;height:70px}
    h1{font-size:23px}
    .sub{font-size:7.5px;letter-spacing:.12em}
    .status{font-size:7.5px;gap:3px 9px}
    .badge{display:none}
    .boot{padding:14px 16px}
    .boot-lines{font-size:8px}
  }
</style>
</head>
<body>
<div id="hero">
  <canvas id="field" aria-hidden="true"></canvas>
  <span class="veil" aria-hidden="true"></span>
  <svg class="reticle" viewBox="0 0 120 120" role="img" aria-label="Rotating acquisition reticle">
    <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(0,229,255,.16)"/>
    <circle cx="60" cy="60" r="42" fill="none" stroke="rgba(0,229,255,.22)" stroke-dasharray="2 7"/>
    <g class="orbit">
      <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(0,229,255,.55)" stroke-width="1.2" stroke-dasharray="46 24 12 24"/>
      <circle cx="60" cy="12" r="2.4" fill="#00E5FF"/>
    </g>
    <g class="orbit-fast">
      <path d="M60 22 A38 38 0 0 1 92 43" fill="none" stroke="rgba(230,241,255,.7)" stroke-width="1.4"/>
      <path d="M60 98 A38 38 0 0 1 28 77" fill="none" stroke="rgba(230,241,255,.45)" stroke-width="1.2"/>
    </g>
    <g class="arc">
      <path d="M60 31 A29 29 0 0 1 89 60" fill="none" stroke="#00E5FF" stroke-width="1.6"/>
      <path d="M60 89 A29 29 0 0 1 31 60" fill="none" stroke="rgba(255,179,0,.8)" stroke-width="1.4"/>
    </g>
    <circle cx="60" cy="60" r="3" fill="#00E5FF"/>
    <path d="M60 46 v8 M60 66 v8 M46 60 h8 M66 60 h8" stroke="#00E5FF" stroke-width="1"/>
  </svg>
  <div class="brand">
    <div class="kicker">registration and change audit</div>
    <h1>INSPECT<span class="slash">/</span>AI <span style="font-size:.42em;letter-spacing:.24em;color:#8FA6C2">VISION CORE</span></h1>
    <div class="sub">OPENCV PIPELINE // LOCAL RUNTIME // HONEST TELEMETRY</div>
    <div class="status">
      <span><i class="dot"></i>OpenCV <span id="cv">—</span></span>
      <span><i class="dot"></i>NumPy <span id="np">—</span></span>
      <span><i class="dot"></i><span id="det">detectors</span></span>
      <span><i class="dot amber"></i><span id="threads">—</span> CV threads</span>
      <span><i class="dot amber"></i>uncalibrated heuristics</span>
    </div>
  </div>
  <div class="badge" id="badge"></div>

  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot-head">VISION CORE // interface boot</div>
    <div class="boot-lines" id="bootLines"></div>
    <div class="boot-track"><div class="boot-fill"></div></div>
    <div class="boot-foot"><span>local capabilities only</span><span id="bootPct">0%</span></div>
  </div>
</div>
<script>
const DATA = __DATA__;
const REDUCED = __REDUCED__ || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
$('cv').textContent = DATA.opencv;
$('np').textContent = DATA.numpy;
$('det').textContent = (DATA.detectors && DATA.detectors.length) ? DATA.detectors.join(' / ') + ' ready' : 'feature detectors unavailable';
$('threads').textContent = String(DATA.threads);
if (DATA.logo_uri){
  const img = document.createElement('img');
  img.alt = 'OpenCV logo';
  img.src = DATA.logo_uri;
  $('badge').appendChild(img);
} else {
  const text = document.createElement('span');
  text.className = 'lt';
  text.textContent = 'BUILT WITH OpenCV';
  $('badge').appendChild(text);
}

if (REDUCED) document.documentElement.classList.add('reduced');

/* ------------------------------------------------------------- */
/* Interface boot (first load only). The lines report the real   */
/* local runtime; the bar measures this boot animation, not the   */
/* inspection pipeline.                                           */
/* ------------------------------------------------------------- */
const boot = $('boot');
if (!DATA.boot || REDUCED){
  boot.classList.add('done');
} else {
  const detectorText = (DATA.detectors || []).join(', ') || 'none';
  const lines = [
    ['> read local runtime', `OpenCV ${DATA.opencv} / NumPy ${DATA.numpy} / Python ${DATA.python}`, 'ok'],
    ['> mount feature detectors', detectorText + `  ·  ${DATA.threads} threads`, 'ok'],
    ['> attach telemetry bridge', 'real progress events, no simulated numbers', 'ok'],
    ['> paint acquisition surface', 'grid / glow / scanlines / reticle', 'ok'],
    ['> interface ready', 'waiting for a reference and test image', 'ok'],
  ];
  let shown = 0;
  const box = $('bootLines');
  const paint = () => {
    box.innerHTML = lines.slice(0, shown).map((line, index) =>
      `${line[0]} <b class="${line[2]}">${line[1]}</b>` + (index === lines.length - 1 ? '' : '\n')
    ).join('');
  };
  paint();
  const step = window.setInterval(() => {
    shown = Math.min(lines.length, shown + 1);
    paint();
    if (shown >= lines.length) window.clearInterval(step);
  }, 430);
  let pct = 0;
  const meter = window.setInterval(() => {
    pct = Math.min(100, pct + 4);
    $('bootPct').textContent = pct + '%';
    if (pct >= 100) window.clearInterval(meter);
  }, 92);
  window.addEventListener('load', () => {
    window.setTimeout(() => {
      boot.classList.add('done');
      window.setTimeout(() => { boot.style.display = 'none'; }, 700);
    }, 2650);
  });
}

/* ------------------------------------------------------------- */
/* Particle field: transform/opacity only, DPR capped at 2,      */
/* paused when the tab is hidden.                                */
/* ------------------------------------------------------------- */
const canvas = $('field');
const context = canvas.getContext('2d', { alpha: true });
let width = 0, height = 0, dpr = 1;
let particles = [];
let pointer = { x: 0, y: 0, tx: 0, ty: 0 };
let frame = 0;
let running = false;

function resize(){
  const rect = canvas.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  width = Math.max(1, rect.width);
  height = Math.max(1, rect.height);
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  context.setTransform(dpr, 0, 0, dpr, 0, 0);
  seed();
  if (REDUCED) drawStatic();
}

function seed(){
  const count = Math.max(28, Math.min(78, Math.round(width / 15)));
  particles = Array.from({ length: count }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: 0.5 + Math.random() * 1.7,
    vx: (Math.random() - 0.5) * 0.10,
    vy: -0.04 - Math.random() * 0.10,
    a: 0.16 + Math.random() * 0.42,
    phase: Math.random() * Math.PI * 2,
  }));
}

function drawStatic(){
  context.clearRect(0, 0, width, height);
  for (const p of particles){
    context.beginPath();
    context.fillStyle = `rgba(0,229,255,${p.a})`;
    context.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    context.fill();
  }
}

function tick(now){
  if (!running) return;
  pointer.x += (pointer.tx - pointer.x) * 0.045;
  pointer.y += (pointer.ty - pointer.y) * 0.045;
  context.clearRect(0, 0, width, height);
  for (const p of particles){
    p.x += p.vx;
    p.y += p.vy;
    if (p.y < -4) p.y = height + 4;
    if (p.x < -4) p.x = width + 4;
    if (p.x > width + 4) p.x = -4;
    const sway = Math.sin(now / 2600 + p.phase) * 3;
    const x = p.x + pointer.x * (6 + p.r * 5) + sway;
    const y = p.y + pointer.y * (4 + p.r * 4);
    context.beginPath();
    context.fillStyle = `rgba(0,229,255,${p.a})`;
    context.arc(x, y, p.r, 0, Math.PI * 2);
    context.fill();
    if (p.r > 1.9){
      context.beginPath();
      context.strokeStyle = 'rgba(0,229,255,.10)';
      context.arc(x, y, p.r * 3.2, 0, Math.PI * 2);
      context.stroke();
    }
  }
  context.strokeStyle = 'rgba(0,229,255,.045)';
  context.beginPath();
  for (let gx = 0; gx < width; gx += 64) { context.moveTo(gx, 0); context.lineTo(gx, height); }
  for (let gy = 0; gy < height; gy += 64) { context.moveTo(0, gy); context.lineTo(width, gy); }
  context.stroke();
  frame = requestAnimationFrame(tick);
}

function start(){
  if (REDUCED || running) return;
  running = true;
  frame = requestAnimationFrame(tick);
}
function stop(){
  running = false;
  if (frame) cancelAnimationFrame(frame);
  frame = 0;
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', (event) => {
  const rect = canvas.getBoundingClientRect();
  pointer.tx = ((event.clientX - rect.left) / Math.max(1, rect.width) - 0.5) * 2;
  pointer.ty = ((event.clientY - rect.top) / Math.max(1, rect.height) - 0.5) * 2;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stop();
  else start();
});
resize();
start();
</script>
</body>
</html>
