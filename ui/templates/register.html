<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');
  :root{
    --navy:#050B18;--panel:#0A1426;--cyan:#00E5FF;--blue:#2979FF;--amber:#FFB300;
    --red:#FF5252;--text:#E6F1FF;--muted:#8FA6C2;--line:rgba(0,229,255,.18);
    --head:'Orbitron','Rajdhani',sans-serif;--data:'Rajdhani','Share Tech Mono',monospace;
    --mono:'Share Tech Mono','Consolas',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);font-family:var(--data)}
  button,input{font:inherit}
  button{color:var(--text);background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.28);padding:5px 9px;cursor:pointer;letter-spacing:.08em;font-family:var(--mono);font-size:10px;text-transform:uppercase}
  button:hover,button:focus-visible{border-color:var(--cyan);outline:none;box-shadow:0 0 14px rgba(0,229,255,.18)}
  button.active{border-color:var(--cyan);background:rgba(0,229,255,.14);color:var(--cyan)}
  .reg-shell{display:flex;flex-direction:column;gap:10px}
  .reg-top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
  .stage-wrap{min-width:0}
  .stage{
    position:relative;width:100%;aspect-ratio:var(--ar);max-height:620px;margin:0 auto;
    background:radial-gradient(circle at 50% 45%,rgba(41,121,255,.10),rgba(3,8,18,.96) 70%);
    border:1px solid rgba(0,229,255,.24);overflow:hidden;
    box-shadow:inset 0 0 70px rgba(0,0,0,.55),0 0 30px rgba(0,229,255,.06);
  }
  .stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:8;
    background:repeating-linear-gradient(to bottom,rgba(230,241,255,.035) 0 1px,transparent 1px 4px);
    opacity:.55;
  }
  .layer,.edge-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;transform-origin:0 0;will-change:transform;pointer-events:none}
  #refImg{z-index:1}
  #testClip{position:absolute;inset:0;z-index:3;transform-origin:0 0;overflow:hidden;pointer-events:none}
  #previewImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:none}
  #ghostImg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.24;display:none;z-index:2;mix-blend-mode:screen;filter:hue-rotate(160deg)}
  #refEdges{z-index:4;display:none;mix-blend-mode:screen;opacity:.8}
  #testEdges{z-index:5;display:none;mix-blend-mode:screen;opacity:.9}
  #markers{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
  .mk-line{stroke:rgba(0,229,255,.55);stroke-width:1.1;vector-effect:non-scaling-stroke}
  .mk-line.outlier{stroke:rgba(255,82,82,.45)}
  .mk-ref{fill:#00E5FF;filter:drop-shadow(0 0 4px #00E5FF)}
  .mk-test{fill:none;stroke:#E6F1FF;stroke-width:1.1;vector-effect:non-scaling-stroke}
  .mk-ref.outlier,.mk-test.outlier{fill:#FF5252;stroke:#FF5252}
  .mk-ring{fill:none;stroke:#00E5FF;stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center;vector-effect:non-scaling-stroke}
  .mk-ring.lock{animation:ringPulse 1.2s ease-out 1}
  @keyframes ringPulse{0%{opacity:.95;transform:scale(.55)}100%{opacity:0;transform:scale(2.5)}}
  #reticle{position:absolute;z-index:7;width:74px;height:74px;margin:-37px 0 0 -37px;left:50%;top:50%;pointer-events:none;opacity:.9;transition:transform .6s ease}
  #reticle .ring{position:absolute;inset:0;border:1px solid rgba(0,229,255,.7);border-radius:50%;box-shadow:0 0 18px rgba(0,229,255,.25)}
  #reticle .ring2{position:absolute;inset:16px;border:1px dashed rgba(0,229,255,.45);border-radius:50%}
  #reticle .cross{position:absolute;left:50%;top:50%;width:88px;height:1px;margin:-.5px 0 0 -44px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
  #reticle .cross.v{transform:rotate(90deg)}
  #reticle.snap .ring{animation:ringPulse 1.2s ease-out 1}
  .stage-hud{position:absolute;inset:0;z-index:9;pointer-events:none}
  .corner{position:absolute;width:22px;height:22px;border-color:rgba(0,229,255,.75);border-style:solid;border-width:0}
  .corner.tl{left:6px;top:6px;border-left-width:1px;border-top-width:1px}
  .corner.tr{right:6px;top:6px;border-right-width:1px;border-top-width:1px}
  .corner.bl{left:6px;bottom:6px;border-left-width:1px;border-bottom-width:1px}
  .corner.br{right:6px;bottom:6px;border-right-width:1px;border-bottom-width:1px}
  .stage-badge{position:absolute;left:12px;top:12px;padding:4px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;background:rgba(4,10,22,.82);border:1px solid var(--cyan);color:var(--cyan)}
  .stage-badge.ambiguous{border-color:var(--amber);color:var(--amber)}
  .stage-badge.rejected{border-color:var(--red);color:var(--red)}
  .stage-badge.skipped{border-color:var(--muted);color:var(--muted)}
  .stage-id{position:absolute;right:12px;top:12px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em}
  .stage-live{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:10px;color:var(--cyan);letter-spacing:.08em}
  .stage-hint{position:absolute;right:12px;bottom:12px;font-family:var(--mono);font-size:9px;color:var(--muted)}
  .swipe-wrap{position:absolute;left:8%;right:8%;bottom:44px;z-index:10;display:none;align-items:center;gap:8px;background:rgba(4,10,22,.8);padding:5px 8px;border:1px solid rgba(0,229,255,.28)}
  .swipe-wrap.show{display:flex}
  .swipe-wrap input{flex:1}
  input[type=range]{accent-color:var(--cyan);background:transparent}
  .reg-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:7px;font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .reg-legend i{display:inline-block;width:7px;height:7px;margin-right:4px;background:currentColor;box-shadow:0 0 7px currentColor}
  .reg-legend .ok{color:var(--cyan)}.reg-legend .amb{color:var(--amber)}.reg-legend .bad{color:var(--red)}
  .info{border:1px solid var(--line);background:rgba(6,14,28,.9);padding:10px;min-width:0}
  .info-head{font-family:var(--mono);font-size:9px;letter-spacing:.15em;color:var(--cyan);text-transform:uppercase;margin-bottom:7px}
  .metric{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid rgba(143,166,194,.12);font-family:var(--mono);font-size:10px}
  .metric span{color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .metric b{color:var(--text);font-weight:400;text-align:right;word-break:break-word}
  .reason{margin-top:8px;padding:7px;border-left:2px solid rgba(0,229,255,.42);background:rgba(0,229,255,.04);font-size:11px;line-height:1.42;color:#c7dcef}
  .reason.ambiguous{border-left-color:var(--amber);background:rgba(255,179,0,.06)}
  .reason.rejected{border-left-color:var(--red);background:rgba(255,82,82,.05)}
  .chart{margin-top:10px}
  .chart-title{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:5px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:74px;border-bottom:1px solid rgba(143,166,194,.24);padding-bottom:2px}
  .bar{position:relative;flex:1;min-width:5px;background:rgba(0,229,255,.3);transition:background .18s ease;cursor:pointer}
  .bar.accepted{background:rgba(0,229,255,.7)}.bar.ambiguous{background:rgba(255,179,0,.75)}.bar.rejected{background:rgba(255,82,82,.6)}.bar.skipped{background:rgba(143,166,194,.32)}
  .bar.sel{background:#fff;box-shadow:0 0 9px rgba(0,229,255,.8)}
  .reg-controls{border:1px solid var(--line);background:rgba(6,14,28,.9);padding:9px}
  .timeline{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .step-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;font-size:9px;border-color:rgba(143,166,194,.25)}
  .step-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);box-shadow:0 0 7px currentColor}
  .step-btn.accepted .dot{background:var(--cyan);color:var(--cyan)}
  .step-btn.ambiguous .dot{background:var(--amber);color:var(--amber)}
  .step-btn.rejected .dot{background:var(--red);color:var(--red)}
  .step-btn.sel{border-color:var(--cyan);background:rgba(0,229,255,.12);color:var(--cyan)}
  .transport{display:grid;grid-template-columns:auto auto auto minmax(80px,1fr) auto;gap:7px;align-items:center}
  .transport input{width:100%}
  .transport .scrub-label{font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap}
  .modes{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:7px}
  .modes .sep{width:1px;height:18px;background:rgba(0,229,255,.18);margin:0 3px}
  .modes label{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .modes label input[type=range]{width:70px}
  .modes input[type=checkbox]{accent-color:var(--cyan)}
  .fidelity{color:var(--cyan)!important}
  .reduced *{animation:none!important;transition:none!important}
  @media(max-width:900px){
    .reg-top{grid-template-columns:1fr}
    .stage{max-height:430px}
    .info{order:2}
    .transport{grid-template-columns:auto auto auto 1fr}
    .transport .scrub-label{display:none}
  }
  @media(max-width:560px){
    .stage{max-height:300px}
    .stage-hint{display:none}
    .modes .sep{display:none}
    .timeline{max-height:96px;overflow:auto}
  }
</style>
</head>
<body>
<div class="reg-shell">
  <div class="reg-top">
    <div class="stage-wrap">
      <div class="stage" id="stage" style="--ar:__ASPECT__">
        <img class="layer" id="refImg" alt="Reference image" />
        <img id="ghostImg" alt="Ambiguous candidate ghost" />
        <div id="testClip"><img class="layer" id="testImg" alt="Aligned test image" /><img id="previewImg" alt="OpenCV warped preview" /></div>
        <img class="edge-layer" id="refEdges" alt="Reference edges" />
        <img class="edge-layer" id="testEdges" alt="Test edges" />
        <svg id="markers" aria-hidden="true"></svg>
        <div id="reticle" aria-hidden="true"><span class="ring"></span><span class="ring2"></span><span class="cross"></span><span class="cross v"></span></div>
        <div class="stage-hud">
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
          <span class="stage-badge" id="stageBadge">LOCKED</span>
          <span class="stage-id" id="stageId">STEP 00</span>
          <span class="stage-live" id="stageLive"></span>
          <span class="stage-hint" id="stageHint">SCRUB TO INSPECT</span>
        </div>
        <div class="swipe-wrap" id="swipeWrap">
          <span>REF</span><input id="swipe" type="range" min="0" max="100" value="50" aria-label="Before and after swipe" /><span>TEST</span>
        </div>
      </div>
      <div class="reg-legend">
        <span class="ok"><i></i>inlier match</span>
        <span class="bad"><i></i>outlier match</span>
        <span class="amb"><i></i>ambiguous candidate</span>
        <span>Lock pulse = markers converge</span>
      </div>
    </div>

    <aside class="info" aria-live="polite">
      <div class="info-head">Step telemetry</div>
      <div id="metrics"></div>
      <div class="reason" id="reason"></div>
      <div class="chart">
        <div class="chart-title">Residual by step (real metrics)</div>
        <div class="bars" id="bars"></div>
      </div>
      <div class="chart-title" style="margin-top:8px">Ghost candidate</div>
      <div id="ghostNote" class="metric"><span>none</span><b>&mdash;</b></div>
    </aside>
  </div>

  <div class="reg-controls">
    <div class="timeline" id="timeline" role="tablist" aria-label="Alignment steps"></div>
    <div class="transport">
      <button id="prev" aria-label="Previous alignment step">&#9664; Prev</button>
      <button id="play" aria-label="Play registration sequence">Play</button>
      <button id="next" aria-label="Next alignment step">Next &#9654;</button>
      <input id="scrub" type="range" min="0" max="1000" value="1000" aria-label="Registration scrubber" />
      <span class="scrub-label" id="scrubLabel">t 1.00</span>
    </div>
    <div class="modes" role="group" aria-label="Overlay modes">
      <button data-mode="blend" class="active">Blend</button>
      <button data-mode="checker">Checker</button>
      <button data-mode="difference">Difference</button>
      <button data-mode="edge">Edges</button>
      <button data-mode="flicker">A/B 2&nbsp;Hz</button>
      <button data-mode="swipe">Swipe</button>
      <span class="sep"></span>
      <label>Mix <input id="opacity" type="range" min="0" max="100" value="58" aria-label="Blend opacity" /></label>
      <span class="sep"></span>
      <label class="fidelity"><input id="fidelity" type="checkbox" /> OpenCV preview</label>
    </div>
  </div>
</div>

<script>
const DATA = __DATA__;
const REDUCED = __REDUCED__ || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (REDUCED) document.body.classList.add('reduced');

const stage = document.getElementById('stage');
const refImg = document.getElementById('refImg');
const testImg = document.getElementById('testImg');
const testClip = document.getElementById('testClip');
const previewImg = document.getElementById('previewImg');
const ghostImg = document.getElementById('ghostImg');
const refEdges = document.getElementById('refEdges');
const testEdges = document.getElementById('testEdges');
const markers = document.getElementById('markers');
const reticle = document.getElementById('reticle');
const timeline = document.getElementById('timeline');
const bars = document.getElementById('bars');
const badge = document.getElementById('stageBadge');
const stageId = document.getElementById('stageId');
const stageLive = document.getElementById('stageLive');
const stageHint = document.getElementById('stageHint');
const metrics = document.getElementById('metrics');
const reasonBox = document.getElementById('reason');
const ghostNote = document.getElementById('ghostNote');
const scrub = document.getElementById('scrub');
const scrubLabel = document.getElementById('scrubLabel');
const opacity = document.getElementById('opacity');
const fidelity = document.getElementById('fidelity');
const swipe = document.getElementById('swipe');
const swipeWrap = document.getElementById('swipeWrap');
const playBtn = document.getElementById('play');

const W = Math.max(1, Number(DATA.width));
const H = Math.max(1, Number(DATA.height));
stage.style.setProperty('--ar', `${W} / ${H}`);
refImg.src = DATA.reference_uri;
testImg.src = DATA.test_uri;
refEdges.src = DATA.ref_edges_uri || '';
stage.querySelectorAll('.layer,#previewImg,#ghostImg').forEach(img => {
  img.style.transformOrigin = '0 0';
});

let selected = Math.max(0, Number(DATA.default_index || 0));
let t = 1;
let mode = 'blend';
let ghostIndex = -1;
let raf = 0;
let flickerTimer = 0;
let playTimer = 0;
let playing = false;
let markerGroups = [];

const steps = DATA.steps || [];

function clamp01(value){ return Math.min(1, Math.max(0, value)); }
function lerp(a,b,p){ return a + (b-a) * p; }
function statusClass(status){ return ['accepted','ambiguous','rejected','skipped'].includes(status) ? status : 'skipped'; }
function statusLabel(status){
  if (status === 'accepted') return 'LOCKED';
  if (status === 'ambiguous') return 'AMBIGUOUS';
  if (status === 'rejected') return 'REJECTED';
  return 'SKIPPED';
}
function fmt(value, digits=2){
  if (value === null || value === undefined || Number.isNaN(Number(value))) return 'n/a';
  return Number(value).toFixed(digits);
}
function currentStep(){ return steps[selected]; }

function similarityMatrix(target, p){
  if (p >= 1) return target;
  const a = target[0][0], b = target[0][1], c = target[1][0], d = target[1][1];
  const angle = Math.atan2(c, a);
  const scale = (Math.hypot(a, c) + Math.hypot(b, d)) / 2 || 1;
  const cx = W / 2, cy = H / 2;
  const fullR = [[scale*Math.cos(angle), -scale*Math.sin(angle)], [scale*Math.sin(angle), scale*Math.cos(angle)]];
  const baseTx = cx - (fullR[0][0]*cx + fullR[0][1]*cy);
  const baseTy = cy - (fullR[1][0]*cx + fullR[1][1]*cy);
  const residX = target[0][2] - baseTx;
  const residY = target[1][2] - baseTy;
  const s = lerp(1, scale, p);
  const th = lerp(0, angle, p);
  const R = [[s*Math.cos(th), -s*Math.sin(th)], [s*Math.sin(th), s*Math.cos(th)]];
  const tx = cx - (R[0][0]*cx + R[0][1]*cy) + residX * p;
  const ty = cy - (R[1][0]*cx + R[1][1]*cy) + residY * p;
  return [[R[0][0], R[0][1], tx], [R[1][0], R[1][1], ty], [0,0,1]];
}

function applyH(matrix, x, y){
  const w = matrix[2][0]*x + matrix[2][1]*y + matrix[2][2] || 1e-9;
  return [(matrix[0][0]*x + matrix[0][1]*y + matrix[0][2]) / w,
          (matrix[1][0]*x + matrix[1][1]*y + matrix[1][2]) / w];
}

function solve8(A, b){
  const n = 8;
  for (let col=0; col<n; col++){
    let pivot = col;
    for (let row=col+1; row<n; row++) if (Math.abs(A[row][col]) > Math.abs(A[pivot][col])) pivot = row;
    if (Math.abs(A[pivot][col]) < 1e-12) return null;
    [A[col], A[pivot]] = [A[pivot], A[col]];
    [b[col], b[pivot]] = [b[pivot], b[col]];
    const div = A[col][col];
    for (let j=col; j<n; j++) A[col][j] /= div;
    b[col] /= div;
    for (let row=0; row<n; row++){
      if (row === col) continue;
      const factor = A[row][col];
      if (!factor) continue;
      for (let j=col; j<n; j++) A[row][j] -= factor * A[col][j];
      b[row] -= factor * b[col];
    }
  }
  return b;
}

function homographyFromCorners(src, dst){
  const A = [], b = [];
  for (let i=0; i<4; i++){
    const [x,y] = src[i], [u,v] = dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v);
  }
  const h = solve8(A, b);
  if (!h) return [[1,0,0],[0,1,0],[0,0,1]];
  return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
}

function transformFor(step, p){
  const target = step.display_matrix;
  const perspective = Math.abs(target[2][0]) + Math.abs(target[2][1]);
  if (perspective > 1e-7 && p < 1){
    const src = [[0,0],[W,0],[W,H],[0,H]];
    const dst = src.map(([x,y]) => {
      const [u,v] = applyH(target, x, y);
      return [lerp(x,u,p), lerp(y,v,p)];
    });
    return homographyFromCorners(src, dst);
  }
  return similarityMatrix(target, p);
}

function cssMatrix(m){
  return `matrix3d(${m[0][0]},${m[1][0]},0,${m[2][0]},${m[0][1]},${m[1][1]},0,${m[2][1]},0,0,1,0,${m[0][2]},${m[1][2]},0,${m[2][2]})`;
}

function decompose(m){
  const angle = Math.atan2(m[1][0], m[0][0]) * 180 / Math.PI;
  const scale = (Math.hypot(m[0][0], m[1][0]) + Math.hypot(m[0][1], m[1][1])) / 2;
  return { angle, scale, tx: m[0][2], ty: m[1][2] };
}

function setBadge(step){
  const cls = statusClass(step.status);
  badge.textContent = statusLabel(step.status);
  badge.className = 'stage-badge ' + cls;
  stageId.textContent = `STEP ${String(step.index).padStart(2,'0')} / ${String(steps.length-1).padStart(2,'0')}`;
  stageLive.textContent = (step.model || 'none').toUpperCase() + ' / ' + (fidelity.checked ? 'OPENCV PREVIEW' : 'ANIMATED TRANSFORM');
}

function buildTimeline(){
  timeline.innerHTML = '';
  steps.forEach((step, index) => {
    const button = document.createElement('button');
    button.className = `step-btn ${statusClass(step.status)}` + (index === selected ? ' sel' : '');
    button.setAttribute('role','tab');
    button.setAttribute('aria-selected', index === selected ? 'true' : 'false');
    button.title = step.reason;
    button.innerHTML = `<span class="dot"></span>${String(step.index).padStart(2,'0')} ${step.name}`;
    button.addEventListener('click', () => selectStep(index, true));
    timeline.appendChild(button);
  });
}

function buildBars(){
  bars.innerHTML = '';
  const values = steps.map(step => Math.max(0, Number(step.residual_after || 0)));
  const maximum = Math.max(0.0001, ...values);
  steps.forEach((step, index) => {
    const bar = document.createElement('button');
    bar.className = `bar ${statusClass(step.status)}` + (index === selected ? ' sel' : '');
    bar.style.height = `${Math.max(5, (Math.max(0, Number(step.residual_after || 0)) / maximum) * 100)}%`;
    bar.title = `${step.name}: residual after ${fmt(step.residual_after, 4)}`;
    bar.setAttribute('aria-label', `${step.name}, residual after ${fmt(step.residual_after, 4)}`);
    bar.addEventListener('click', () => selectStep(index, true));
    bars.appendChild(bar);
  });
}

function buildMarkers(step){
  markers.innerHTML = '';
  markerGroups = [];
  const refs = step.keypoints_ref || [];
  const tests = step.keypoints_test || [];
  const flags = step.keypoint_flags || [];
  markers.setAttribute('viewBox', `0 0 ${W} ${H}`);
  for (let i=0; i<Math.min(refs.length, tests.length); i++){
    const inlier = flags.length ? Boolean(flags[i]) : true;
    const group = document.createElementNS('http://www.w3.org/2000/svg','g');
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('class','mk-line' + (inlier ? '' : ' outlier'));
    const ref = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ref.setAttribute('class','mk-ref' + (inlier ? '' : ' outlier'));
    ref.setAttribute('cx', refs[i][0]); ref.setAttribute('cy', refs[i][1]); ref.setAttribute('r', inlier ? 2.2 : 1.6);
    const test = document.createElementNS('http://www.w3.org/2000/svg','circle');
    test.setAttribute('class','mk-test' + (inlier ? '' : ' outlier'));
    test.setAttribute('r', inlier ? 2.6 : 1.8);
    const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
    ring.setAttribute('class','mk-ring');
    ring.setAttribute('cx', refs[i][0]); ring.setAttribute('cy', refs[i][1]); ring.setAttribute('r', 5);
    group.appendChild(line); group.appendChild(ref); group.appendChild(test); group.appendChild(ring);
    markers.appendChild(group);
    markerGroups.push({group,line,test,ring,refX:refs[i][0],refY:refs[i][1],testX:tests[i][0],testY:tests[i][1],inlier,locked:false});
  }
}

function updateMarkers(matrix){
  if (!markerGroups.length) return;
  markerGroups.forEach((item) => {
    const [x,y] = applyH(matrix, item.testX, item.testY);
    item.line.setAttribute('x1', x); item.line.setAttribute('y1', y);
    item.line.setAttribute('x2', item.refX); item.line.setAttribute('y2', item.refY);
    item.test.setAttribute('cx', x); item.test.setAttribute('cy', y);
    const locked = Math.hypot(x-item.refX, y-item.refY) < 2.4;
    if (locked && !item.locked && !REDUCED){
      item.ring.classList.remove('lock');
      void item.ring.getBoundingClientRect();
      item.ring.classList.add('lock');
    }
    item.locked = locked;
  });
}

function updateReticle(matrix, step){
  if (step.keypoints_ref && step.keypoints_ref.length){
    reticle.style.display = 'none';
    return;
  }
  reticle.style.display = 'block';
  const [x,y] = applyH(matrix, W/2, H/2);
  reticle.style.left = `${(x / W) * 100}%`;
  reticle.style.top = `${(y / H) * 100}%`;
}

function setGhost(step){
  ghostIndex = -1;
  if (step.status === 'ambiguous'){
    const other = steps.find(candidate => candidate.index !== step.index && candidate.status === 'ambiguous' && candidate.preview_uri);
    if (other){
      ghostIndex = other.index;
      ghostImg.src = other.preview_uri;
      ghostImg.style.display = 'block';
      ghostNote.innerHTML = `<span>ghost ${String(other.index).padStart(2,'0')}</span><b>${other.name}</b>`;
      return;
    }
  }
  ghostImg.style.display = 'none';
  ghostNote.innerHTML = '<span>none</span><b>&mdash;</b>';
}

function renderMetrics(step, matrix){
  const d = decompose(matrix);
  const rows = [
    ['model', step.model || 'none'],
    ['status', statusLabel(step.status)],
    ['rotation', `${fmt(d.angle,2)} deg`],
    ['scale', fmt(d.scale,4)],
    ['translation', `${fmt(d.tx,1)}, ${fmt(d.ty,1)} px`],
    ['inliers', step.inlier_ratio !== null ? `${fmt(Number(step.inlier_ratio)*100,1)} %` : 'n/a'],
    ['ECC cc', step.ecc_cc !== null ? fmt(step.ecc_cc,4) : 'n/a'],
    ['residual', `${fmt(step.residual_before,3)} -> ${fmt(step.residual_after,3)}`],
  ];
  metrics.innerHTML = rows.map(([key,value]) => `<div class="metric"><span>${key}</span><b>${value}</b></div>`).join('');
  reasonBox.className = 'reason ' + statusClass(step.status);
  reasonBox.textContent = step.reason;
  stageLive.textContent = `${(step.model || 'none').toUpperCase()} / t ${t.toFixed(2)} / ${fidelity.checked ? 'OPENCV PREVIEW' : 'ANIMATED'}`;
}

function applyMode(){
  swipeWrap.classList.toggle('show', mode === 'swipe');
  refImg.style.display = 'block';
  testClip.style.display = 'block';
  previewImg.style.display = fidelity.checked ? 'block' : 'none';
  testImg.style.display = fidelity.checked ? 'none' : 'block';
  testClip.style.opacity = '1';
  testClip.style.mixBlendMode = 'normal';
  testClip.style.webkitMaskImage = 'none';
  testClip.style.maskImage = 'none';
  testClip.style.clipPath = 'none';
  refEdges.style.display = 'none';
  testEdges.style.display = 'none';
  refImg.style.opacity = '1';
  stageHint.textContent = fidelity.checked ? 'OPENCV WARP PREVIEW' : 'SCRUB TO INSPECT';

  if (mode === 'blend'){
    testClip.style.opacity = String(Number(opacity.value) / 100);
  } else if (mode === 'checker'){
    testClip.style.webkitMaskImage = 'repeating-conic-gradient(#000 0 25%, transparent 0 50%)';
    testClip.style.maskImage = 'repeating-conic-gradient(#000 0 25%, transparent 0 50%)';
    testClip.style.webkitMaskSize = '44px 44px';
    testClip.style.maskSize = '44px 44px';
  } else if (mode === 'difference'){
    testClip.style.mixBlendMode = 'difference';
    testClip.style.opacity = '1';
  } else if (mode === 'edge'){
    testClip.style.display = 'none';
    refImg.style.opacity = '0.14';
    refEdges.style.display = 'block';
    testEdges.style.display = 'block';
    stageHint.textContent = 'EDGE OVERLAY / STEP PREVIEW';
  } else if (mode === 'flicker'){
    testClip.style.opacity = '1';
    startFlicker();
  } else if (mode === 'swipe'){
    testClip.style.opacity = '1';
    applySwipe();
  }
  if (mode !== 'flicker') stopFlicker();
}

function applySwipe(){
  const value = Number(swipe.value);
  testClip.style.clipPath = `inset(0 0 0 ${value}%)`;
}

function startFlicker(){
  stopFlicker();
  if (REDUCED) return;
  let visible = true;
  flickerTimer = window.setInterval(() => {
    visible = !visible;
    testClip.style.opacity = visible ? '1' : '0';
  }, 500);
}
function stopFlicker(){ if (flickerTimer){ clearInterval(flickerTimer); flickerTimer = 0; } }

function render(){
  const step = currentStep();
  if (!step) return;
  const matrix = transformFor(step, t);
  testClip.style.transform = cssMatrix(matrix);
  testImg.style.transform = 'none';
  previewImg.style.transform = 'none';
  updateMarkers(matrix);
  updateReticle(matrix, step);
  renderMetrics(step, matrix);
  setBadge(step);
  scrub.value = String(Math.round(t * 1000));
  scrubLabel.textContent = `t ${t.toFixed(2)} / ${step.status}`;
}

function cancelAnimation(){
  if (raf){ cancelAnimationFrame(raf); raf = 0; }
}

function animateTo(target, duration = 1500){
  cancelAnimation();
  if (REDUCED){ t = target; render(); return; }
  const from = t;
  const started = performance.now();
  const frame = (now) => {
    const progress = clamp01((now - started) / duration);
    const eased = 1 - Math.pow(1 - progress, 3);
    t = lerp(from, target, eased);
    render();
    if (progress < 1){ raf = requestAnimationFrame(frame); }
    else { raf = 0; t = target; render(); pulseLock(); }
  };
  raf = requestAnimationFrame(frame);
}

function pulseLock(){
  const step = currentStep();
  if (!step || REDUCED) return;
  if (step.keypoints_ref && step.keypoints_ref.length){ return; }
  reticle.classList.remove('snap');
  void reticle.getBoundingClientRect();
  reticle.classList.add('snap');
}

function selectStep(index, animate){
  selected = Math.min(steps.length - 1, Math.max(0, index));
  const step = currentStep();
  if (!step) return;
  buildTimeline();
  buildBars();
  setGhost(step);
  testEdges.src = step.edge_uri || '';
  previewImg.src = step.preview_uri || '';
  buildMarkers(step);
  t = 1;
  applyMode();
  if (animate && !REDUCED){ t = 0; animateTo(1, 1450); } else { render(); }
}

function nextStep(){ selectStep((selected + 1) % steps.length, true); }
function prevStep(){ selectStep((selected - 1 + steps.length) % steps.length, true); }

function stopPlay(){
  playing = false;
  playBtn.textContent = 'Play';
  playBtn.classList.remove('active');
  if (playTimer){ clearTimeout(playTimer); playTimer = 0; }
}
function playSequence(){
  if (playing){ stopPlay(); return; }
  playing = true;
  playBtn.textContent = 'Pause';
  playBtn.classList.add('active');
  const accepted = steps.filter(step => step.status === 'accepted');
  const queue = accepted.length ? accepted : steps;
  let cursor = 0;
  const advance = () => {
    if (!playing) return;
    if (cursor >= queue.length){ stopPlay(); return; }
    const step = queue[cursor++];
    selectStep(step.index, true);
    playTimer = window.setTimeout(advance, REDUCED ? 120 : 1900);
  };
  advance();
}

scrub.addEventListener('input', () => {
  if (playing) stopPlay();
  cancelAnimation();
  t = Number(scrub.value) / 1000;
  render();
});
opacity.addEventListener('input', () => { if (mode === 'blend') applyMode(); });
fidelity.addEventListener('change', () => { applyMode(); render(); });
swipe.addEventListener('input', applySwipe);
document.getElementById('prev').addEventListener('click', () => { stopPlay(); prevStep(); });
document.getElementById('next').addEventListener('click', () => { stopPlay(); nextStep(); });
playBtn.addEventListener('click', playSequence);
document.querySelectorAll('[data-mode]').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('[data-mode]').forEach(other => other.classList.remove('active'));
    button.classList.add('active');
    mode = button.dataset.mode;
    applyMode();
  });
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowRight'){ stopPlay(); nextStep(); }
  if (event.key === 'ArrowLeft'){ stopPlay(); prevStep(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ stopPlay(); stopFlicker(); }
});

buildTimeline();
buildBars();
selectStep(selected, !REDUCED);
</script>
</body>
</html>
